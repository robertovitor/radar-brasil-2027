name: Agendar publicação editorial via dispatch

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: editorial-native-scheduler
  cancel-in-progress: true

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Registrar gatilho do scheduler editorial
        run: |
          echo "editorial_intermediate_scheduler_active=true"
          echo "trigger_event=${{ github.event_name }}"
          echo "triggered_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Disparar workflow oficial editorial
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Disparando mesclar-inbox-editorial.yml via workflow_dispatch."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GH_REPO}/actions/workflows/mesclar-inbox-editorial.yml/dispatches" \
            -f ref=main
          echo "editorial_dispatch_requested=true"
