name: Mesclar inbox editorial

on:
  schedule:
    - cron: '45 * * * *'
  push:
    branches: [main]
    paths:
      - 'editorial/inbox.json'
      - 'editorial/executar-automatico.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mesclar-inbox-editorial
  cancel-in-progress: false

jobs:
  mesclar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Registrar agenda nativa
        run: |
          echo "merge_native_scheduler=true"
          echo "scheduled_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Instalar dependências da planilha
        run: pip install openpyxl==3.1.5
      - name: Mesclar itens aprovados e enfileirar novidades
        run: python scripts/mesclar_inbox_editorial.py
      - name: Sincronizar planilha com os dados atuais
        run: python scripts/sincronizar_planilha.py
