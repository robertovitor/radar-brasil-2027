name: Validar publicação do Instagram

on:
  workflow_dispatch:
    inputs:
      post_file:
        description: Arquivo JSON a validar
        required: true
        default: instagram/fila/post-inaugural.json
        type: string

# Este workflow é deliberadamente somente leitura.
# A publicação real é exclusiva de publicar-instagram-automatico.yml.
permissions:
  contents: read

concurrency:
  group: instagram-validator
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POST_FILE: ${{ github.event.inputs.post_file || 'instagram/fila/post-inaugural.json' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Restringir arquivo à fila do Instagram
        run: |
          case "$POST_FILE" in
            instagram/fila/*.json) ;;
            *) echo "Validação bloqueada: arquivo fora de instagram/fila."; exit 1 ;;
          esac

      - name: Validar sem credenciais e sem publicar
        run: |
          python scripts/publicar_instagram.py \
            --post "$POST_FILE" \
            --ledger instagram/publicados.json \
            --mode validate
