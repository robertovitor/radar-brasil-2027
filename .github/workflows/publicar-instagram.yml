name: Publicar no Instagram

on:
  workflow_dispatch:
    inputs:
      post_file:
        description: Arquivo JSON aprovado
        required: true
        default: instagram/fila/post-inaugural.json
        type: string
      mode:
        description: Tipo de execução
        required: true
        default: validate
        type: choice
        options:
          - validate
          - dry-run
          - publish
      confirmar_publicacao:
        description: Para publicar, digite PUBLICAR
        required: false
        default: ""
        type: string
  push:
    paths:
      - instagram/validar-agora.txt
      - instagram/publicar-agora.txt

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POST_FILE: ${{ github.event.inputs.post_file || 'instagram/fila/post-inaugural.json' }}
      MODE: ${{ github.event_name == 'push' && 'publish' || github.event.inputs.mode || 'validate' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolver solicitação de publicação
        if: env.MODE == 'publish'
        env:
          CONFIRMACAO_WORKFLOW: ${{ github.event.inputs.confirmar_publicacao }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            solicitacao="$(tr -d '\r' < instagram/publicar-agora.txt)"
            confirmacao="$(printf '%s' "$solicitacao" | awk '{print $1}')"
            post_file="$(printf '%s' "$solicitacao" | cut -d' ' -f2- | xargs)"
            if [ -z "$post_file" ]; then
              post_file="instagram/fila/post-inaugural.json"
            fi
            echo "POST_FILE=$post_file" >> "$GITHUB_ENV"
          else
            confirmacao="$CONFIRMACAO_WORKFLOW"
          fi
          if [ "$confirmacao" != "PUBLICAR" ]; then
            echo "Publicação bloqueada: confirmação explícita ausente."
            exit 1
          fi
          case "$POST_FILE" in
            instagram/fila/*.json) ;;
            *) echo "Publicação bloqueada: arquivo fora de instagram/fila."; exit 1 ;;
          esac

      - name: Validar ou publicar
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_GRAPH_VERSION: v25.0
        run: |
          python scripts/publicar_instagram.py \
            --post "$POST_FILE" \
            --ledger instagram/publicados.json \
            --mode "$MODE" \
            --min-hours-between 4 \
            --max-per-24h 2

      - name: Registrar publicação sem duplicidade
        if: env.MODE == 'publish'
        run: |
          if git diff --quiet -- instagram/publicados.json; then
            echo "O registro não mudou; nenhuma gravação necessária."
            exit 0
          fi
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/publicados.json
          git commit -m "Registra publicação no Instagram"
          git pull --rebase origin main
          git push origin HEAD:main
