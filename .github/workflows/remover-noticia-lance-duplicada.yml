name: Remover notícia Lance duplicada

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remover-noticia-lance-duplicada.yml'

permissions:
  contents: write

jobs:
  remover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remover somente a notícia duplicada do Lance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('noticias.json')
          items = json.loads(path.read_text(encoding='utf-8'))
          alvo = 'https://www.lance.com.br/futebol-nacional/quais-serao-as-cidades-sedes-e-os-estadios-do-brasil-na-copa-do-mundo-feminina-de-2027.html'
          novos = [x for x in items if str(x.get('Link','')).strip() != alvo]
          removidos = len(items) - len(novos)
          if removidos != 1:
              raise SystemExit(f'Esperado remover exatamente 1 notícia, removidos={removidos}')
          path.write_text(json.dumps(novos, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('removed_lance_duplicate=1')
          PY

      - name: Commitar somente noticias.json
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noticias.json
          git commit -m 'Remove notícia duplicada do Lance'
          git pull --rebase origin main
          git push origin main
