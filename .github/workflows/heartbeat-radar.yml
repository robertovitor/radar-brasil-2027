name: Heartbeat Radar

on:
  # Contingência manual apenas. A recuperação horária principal é feita pela
  # automação externa Monitorar rotina Radar (:22), que verifica antes de agir.
  # Manter cron aqui causaria gatilhos cegos e execuções redundantes.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartbeat-radar-manual
  cancel-in-progress: false

jobs:
  recuperar-editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Disparar contingência editorial manual
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'timestamp=%s\nid=heartbeat-editorial-manual-%s\n' "$ts" "$(date -u +'%Y%m%dT%H%M%SZ')" > editorial/executar-automatico.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial/executar-automatico.txt
          if git diff --cached --quiet; then
            echo 'Heartbeat editorial sem alteração; nada a publicar.'
            exit 0
          fi
          git commit -m 'heartbeat: recuperação editorial manual'
          git pull --rebase origin main
          git push origin HEAD:main

  recuperar-instagram:
    needs: recuperar-editorial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Disparar contingência do Instagram manual
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '%s heartbeat-instagram-manual-%s\n' "$ts" "$(date -u +'%Y%m%dT%H%M%SZ')" > instagram/executar-automatico.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add instagram/executar-automatico.txt
          if git diff --cached --quiet; then
            echo 'Heartbeat Instagram sem alteração; nada a publicar.'
            exit 0
          fi
          git commit -m 'heartbeat: recuperação Instagram manual'
          git pull --rebase origin main
          git push origin HEAD:main
