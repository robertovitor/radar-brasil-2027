name: Saúde operacional do Radar

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Registrar agenda nativa da saúde
        run: |
          echo "health_native_scheduler=true"
          echo "health_scheduler_registration=v3"
          echo "scheduled_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Registrar limite de observabilidade da pesquisa editorial externa
        run: |
          echo 'pesquisa_editorial_source=chatgpt_automation'
          echo 'pesquisa_editorial_github_observable=false'
          echo 'pesquisa_editorial_note=nao_e_falha_ausencia_de_run_no_github'

      - name: Verificar frescor do merge editorial
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh run list --repo "$GH_REPO" --workflow mesclar-inbox-editorial.yml --limit 1 --json createdAt,status,conclusion,event --jq '.[0]')"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo 'merge_run_missing=true'
            exit 1
          fi
          echo "merge_latest=$latest"
          created="$(echo "$latest" | jq -r '.createdAt')"
          status="$(echo "$latest" | jq -r '.status')"
          conclusion="$(echo "$latest" | jq -r '.conclusion // ""')"
          python - "$created" "$status" "$conclusion" <<'PY'
          import datetime as dt
          import sys
          raw, status, conclusion = sys.argv[1:]
          stamp = dt.datetime.fromisoformat(raw.replace('Z', '+00:00'))
          age = (dt.datetime.now(dt.timezone.utc) - stamp.astimezone(dt.timezone.utc)).total_seconds()
          print(f'merge_run_age_seconds={int(age)}')
          print(f'merge_run_status={status}')
          print(f'merge_run_conclusion={conclusion}')
          if age > 7200:
              raise SystemExit('merge_run_stale_over_2h=true')
          if status == 'completed' and conclusion not in ('success', 'neutral', 'skipped'):
              raise SystemExit('merge_run_failed=true')
          PY

      - name: Verificar frescor do workflow do Instagram
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh run list --repo "$GH_REPO" --workflow publicar-instagram-automatico.yml --limit 1 --json createdAt,status,conclusion,event --jq '.[0]')"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo 'instagram_run_missing=true'
            exit 1
          fi
          echo "instagram_latest=$latest"
          created="$(echo "$latest" | jq -r '.createdAt')"
          status="$(echo "$latest" | jq -r '.status')"
          conclusion="$(echo "$latest" | jq -r '.conclusion // ""')"
          python - "$created" "$status" "$conclusion" <<'PY'
          import datetime as dt
          import sys
          raw, status, conclusion = sys.argv[1:]
          stamp = dt.datetime.fromisoformat(raw.replace('Z', '+00:00'))
          age = (dt.datetime.now(dt.timezone.utc) - stamp.astimezone(dt.timezone.utc)).total_seconds()
          print(f'instagram_run_age_seconds={int(age)}')
          print(f'instagram_run_status={status}')
          print(f'instagram_run_conclusion={conclusion}')
          if age > 5400:
              raise SystemExit('instagram_run_stale_over_90m=true')
          if status == 'completed' and conclusion not in ('success', 'neutral', 'skipped'):
              raise SystemExit('instagram_run_failed=true')
          PY
