name: Publicar automaticamente no Instagram

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - instagram/executar-automatico.txt
      - instagram/imagens-curadas.json

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  selecionar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Instalar processamento de imagens
        run: pip install pillow==11.3.0
      - name: Selecionar conteúdo sem repetir imagem
        id: selecionar
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[manual-bypass-interval]') }}" == "true" ]]; then
            output="$(python - <<'PY'
          import datetime as dt
          import json
          import sys
          sys.path.insert(0, 'scripts')
          import preparar_post_instagram_sem_repetir_imagem as wrapper

          original_load = wrapper.base.load
          def load_with_manual_interval_bypass(path, default):
              data = original_load(path, default)
              if str(path) != 'instagram/publicados.json' or not isinstance(data, dict):
                  return data
              cloned = json.loads(json.dumps(data))
              for row in cloned.get('published', []):
                  stamp = str(row.get('published_at') or '').strip()
                  if not stamp:
                      continue
                  try:
                      value = dt.datetime.fromisoformat(stamp.replace('Z', '+00:00'))
                      row['published_at'] = (value - dt.timedelta(hours=2)).isoformat()
                  except Exception:
                      pass
              return cloned

          wrapper.base.load = load_with_manual_interval_bypass
          print('minimum_interval_bypass=manual_once')
          raise SystemExit(wrapper.main())
          PY
            )"
          else
            output="$(python scripts/preparar_post_instagram_sem_repetir_imagem.py)"
          fi
          echo "$output"
          found="$(echo "$output" | sed -n 's/^found=//p' | tail -1)"
          batch="$(echo "$output" | sed -n 's/^batch_file=//p' | tail -1)"
          echo "found=${found:-false}" >> "$GITHUB_OUTPUT"
          echo "batch_file=$batch" >> "$GITHUB_OUTPUT"
      - name: Salvar imagem e fila aprovadas
        if: steps.selecionar.outputs.found == 'true'
        run: |
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/artes instagram/fila/automatica
          git commit -m "Prepara post com imagem única"
          git pull --rebase origin main
          git push origin HEAD:main
          sleep 15
      - name: Publicar somente o item selecionado
        id: publicar
        if: steps.selecionar.outputs.found == 'true'
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_GRAPH_VERSION: v25.0
        run: python scripts/publicar_lote_instagram.py --batch "${{ steps.selecionar.outputs.batch_file }}" --ledger instagram/publicados.json
      - name: Registrar publicação confirmada
        if: always() && steps.selecionar.outputs.found == 'true'
        run: |
          if git diff --quiet -- instagram/publicados.json; then exit 0; fi
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/publicados.json
          git commit -m "Registra publicação no Instagram"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Sinalizar falha
        if: always() && steps.publicar.outcome == 'failure'
        run: exit 1
