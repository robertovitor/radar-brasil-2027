name: Publicar automaticamente no Instagram

on:
  schedule:
    # Janelas de 08h, 12h, 18h e 22h em Brasília.
    - cron: "7 1,11,15,21 * * *"
  workflow_dispatch:
  push:
    paths:
      - instagram/executar-automatico.txt

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  selecionar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar gerador de artes
        run: pip install pillow==11.3.0

      - name: Preparar todas as publicações inéditas elegíveis
        id: selecionar
        run: python scripts/gerar_post_instagram.py --github-output "$GITHUB_OUTPUT"

      - name: Disponibilizar artes e lote
        if: steps.selecionar.outputs.found == 'true'
        run: |
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/artes instagram/fila/automatica
          git commit -m "Cria lote de artes exclusivas para o Instagram"
          git pull --rebase origin main
          git push origin HEAD:main
          sleep 15

      - name: Publicar lote completo
        id: publicar
        if: steps.selecionar.outputs.found == 'true'
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_GRAPH_VERSION: v25.0
        run: |
          python scripts/publicar_lote_instagram.py \
            --batch "${{ steps.selecionar.outputs.batch_file }}" \
            --ledger instagram/publicados.json

      - name: Registrar todas as publicações concluídas
        if: always() && steps.selecionar.outputs.found == 'true'
        run: |
          if git diff --quiet -- instagram/publicados.json; then
            echo "O registro não mudou; nenhuma gravação necessária."
            exit 0
          fi
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/publicados.json
          git commit -m "Registra lote publicado no Instagram"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Sinalizar lote incompleto
        if: always() && steps.publicar.outcome == 'failure'
        run: |
          echo "Uma ou mais publicações do lote falharam; os sucessos foram preservados."
          exit 1
