name: Publicar automaticamente no Instagram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - instagram/executar-automatico.txt
      - instagram/imagens-curadas.json

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  selecionar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Instalar processamento de imagens
        run: pip install pillow==11.3.0
      - name: Aguardar intervalo mínimo entre publicações
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import time
          from pathlib import Path
          ledger = Path("instagram/publicados.json")
          if not ledger.exists():
              print("interval_wait_seconds=0")
              raise SystemExit(0)
          try:
              data = json.loads(ledger.read_text(encoding="utf-8"))
              stamps = [row.get("published_at") for row in data.get("published", []) if isinstance(row, dict) and row.get("published_at")]
              if not stamps:
                  print("interval_wait_seconds=0")
                  raise SystemExit(0)
              last = max(dt.datetime.fromisoformat(str(stamp).replace("Z", "+00:00")) for stamp in stamps)
              if last.tzinfo is None: last = last.replace(tzinfo=dt.timezone.utc)
              elapsed = (dt.datetime.now(dt.timezone.utc) - last.astimezone(dt.timezone.utc)).total_seconds()
              remaining = max(0, int(3600 - elapsed + 1))
              print(f"interval_elapsed_seconds={max(0, int(elapsed))}")
              print(f"interval_wait_seconds={remaining}")
              if remaining: time.sleep(remaining)
          except Exception as exc:
              print(f"interval_wait_error={exc}")
              print("A seleção normal manterá o bloqueio de segurança.")
          PY
      - name: Atualizar estado antes da seleção
        run: git pull --rebase origin main
      - name: Selecionar conteúdo com busca semântica e título completo
        id: selecionar
        shell: bash
        run: |
          output="$(python scripts/preparar_post_instagram_v2.py)"
          echo "$output"
          found="$(echo "$output" | sed -n 's/^found=//p' | tail -1)"
          batch="$(echo "$output" | sed -n 's/^batch_file=//p' | tail -1)"
          echo "found=${found:-false}" >> "$GITHUB_OUTPUT"
          echo "batch_file=$batch" >> "$GITHUB_OUTPUT"
      - name: Salvar imagem e fila aprovadas
        if: steps.selecionar.outputs.found == 'true'
        run: |
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/artes instagram/fila/automatica
          if git diff --cached --quiet; then
            echo "prepare_commit_skipped=no_changes"
          else
            git commit -m "Prepara post com imagem única"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Reservar publicação antes de chamar a Meta
        if: steps.selecionar.outputs.found == 'true'
        run: |
          git pull --rebase origin main
          python scripts/reservar_publicacao_instagram.py reserve --batch "${{ steps.selecionar.outputs.batch_file }}"
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/reservas-publicacao.json
          if git diff --cached --quiet; then
            echo "reservation_commit_skipped=no_changes"
          else
            git commit -m "Reserva post antes da publicação no Instagram"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publicar somente o item selecionado
        id: publicar
        if: steps.selecionar.outputs.found == 'true'
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_GRAPH_VERSION: v25.0
        run: python scripts/publicar_lote_instagram.py --batch "${{ steps.selecionar.outputs.batch_file }}" --ledger instagram/publicados.json
      - name: Registrar publicação confirmada ou reconciliada
        if: always() && steps.selecionar.outputs.found == 'true'
        run: |
          if git diff --quiet -- instagram/publicados.json; then exit 0; fi
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/publicados.json
          git commit -m "Registra publicação confirmada no Instagram"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Limpar reserva somente após sucesso confirmado
        if: always() && steps.selecionar.outputs.found == 'true' && steps.publicar.outcome == 'success'
        run: |
          git pull --rebase origin main
          python scripts/reservar_publicacao_instagram.py clear --batch "${{ steps.selecionar.outputs.batch_file }}"
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/reservas-publicacao.json
          if git diff --cached --quiet; then
            echo "reservation_clear_commit_skipped=no_changes"
          else
            git commit -m "Libera reserva após publicação confirmada"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Sinalizar falha sem liberar a trava idempotente
        if: always() && steps.publicar.outcome == 'failure'
        run: |
          echo "A publicação falhou; a reserva foi mantida para impedir duplicação até a próxima reconciliação."
          exit 1
