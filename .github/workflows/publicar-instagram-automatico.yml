name: Publicar automaticamente no Instagram

on:
  schedule:
    # 08:00, 12:00, 18:00 e 22:00 no horário de Brasília (UTC-3).
    - cron: "0 1,11,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  selecionar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar gerador de artes
        run: pip install pillow==11.3.0

      - name: Selecionar conteúdo relevante e inédito
        id: selecionar
        run: |
          python scripts/gerar_post_instagram.py --github-output "$GITHUB_OUTPUT"

      - name: Disponibilizar arte e post
        if: steps.selecionar.outputs.found == 'true'
        run: |
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/artes instagram/fila/automatica
          git commit -m "Cria arte exclusiva para publicação no Instagram"
          git pull --rebase origin main
          git push origin HEAD:main
          sleep 15

      - name: Publicar conteúdo selecionado
        if: steps.selecionar.outputs.found == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_GRAPH_VERSION: v25.0
        run: |
          python scripts/publicar_instagram.py \
            --post "${{ steps.selecionar.outputs.post_file }}" \
            --ledger instagram/publicados.json \
            --mode publish \
            --min-hours-between 4 \
            --max-per-24h 4

      - name: Registrar fila e publicação
        if: steps.selecionar.outputs.found == 'true'
        run: |
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/publicados.json
          git commit -m "Publica conteúdo relevante no Instagram"
          git pull --rebase origin main
          git push origin HEAD:main
