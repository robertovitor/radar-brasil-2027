name: Publicar automaticamente no Instagram

on:
  # A cadência oficial vem do heartbeat da automação principal (:12) e,
  # somente se ele falhar, da contingência do monitor. Não há cron nem
  # workflow_run aqui para evitar chamadas paralelas à Meta.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - instagram/executar-automatico.txt
      - instagram/imagens-curadas.json

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  verificar-intervalo:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.intervalo.outputs.eligible }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Verificar intervalo mínimo entre publicações
        id: intervalo
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          ledger = Path("instagram/publicados.json")
          eligible = True
          elapsed = None
          if ledger.exists():
              try:
                  data = json.loads(ledger.read_text(encoding="utf-8"))
                  stamps = []
                  for row in data.get("published", []):
                      if not isinstance(row, dict):
                          continue
                      # A publicação remota também consome o intervalo. Para
                      # ledgers antigos, reconciled_at é o melhor limite seguro.
                      raw = row.get("published_at") or row.get("reconciled_at")
                      if raw:
                          stamps.append(raw)
                  if stamps:
                      last = max(dt.datetime.fromisoformat(str(stamp).replace("Z", "+00:00")) for stamp in stamps)
                      if last.tzinfo is None:
                          last = last.replace(tzinfo=dt.timezone.utc)
                      elapsed = (dt.datetime.now(dt.timezone.utc) - last.astimezone(dt.timezone.utc)).total_seconds()
                      eligible = elapsed >= 3600
              except Exception as exc:
                  print(f"interval_check_warning={exc}")
          print(f"interval_elapsed_seconds={int(elapsed) if elapsed is not None else 'none'}")
          print(f"interval_eligible={str(eligible).lower()}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"eligible={str(eligible).lower()}\n")
          PY

  selecionar-e-publicar:
    needs: verificar-intervalo
    if: needs.verificar-intervalo.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Instalar processamento de imagens
        run: pip install pillow==11.3.0
      - name: Atualizar estado antes da seleção
        run: git pull --rebase --autostash origin main

      - name: Verificar cooldown da Meta
        id: meta_cooldown
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          path = Path("instagram/meta-rate-limit.json")
          blocked = False
          blocked_until = ""
          if path.exists():
              try:
                  state = json.loads(path.read_text(encoding="utf-8"))
                  raw = str(state.get("blocked_until") or "").strip()
                  if state.get("active") and raw:
                      until = dt.datetime.fromisoformat(raw.replace("Z", "+00:00"))
                      if until.tzinfo is None:
                          until = until.replace(tzinfo=dt.timezone.utc)
                      blocked = dt.datetime.now(dt.timezone.utc) < until.astimezone(dt.timezone.utc)
                      blocked_until = until.astimezone(dt.timezone.utc).isoformat()
              except Exception as exc:
                  print(f"meta_cooldown_check_warning={exc}")
          print(f"meta_cooldown_active={str(blocked).lower()}")
          if blocked_until:
              print(f"meta_cooldown_until={blocked_until}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"blocked={str(blocked).lower()}\n")
              output.write(f"blocked_until={blocked_until}\n")
          PY
      - name: Aguardar próximo gatilho quando cooldown estiver ativo
        if: steps.meta_cooldown.outputs.blocked == 'true'
        run: |
          echo "meta_rate_limit_deferred=true"
          echo "meta_rate_limit_resume_after=${{ steps.meta_cooldown.outputs.blocked_until }}"
          echo "Nenhuma chamada à Meta será feita durante o cooldown. O próximo gatilho após o horário de liberação tentará novamente."

      - name: Selecionar conteúdo com busca semântica e título completo
        id: selecionar
        if: steps.meta_cooldown.outputs.blocked != 'true'
        shell: bash
        run: |
          set +e
          output="$(PYTHONPATH=scripts python scripts/preparar_post_instagram_v2.py 2>&1)"
          status=$?
          set -e
          echo "$output"
          found="$(echo "$output" | sed -n 's/^found=//p' | tail -1)"
          batch="$(echo "$output" | sed -n 's/^batch_file=//p' | tail -1)"
          reason="$(echo "$output" | sed -n 's/^reason=//p' | tail -1)"
          echo "found=${found:-false}" >> "$GITHUB_OUTPUT"
          echo "batch_file=$batch" >> "$GITHUB_OUTPUT"
          echo "reason=${reason:-none}" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            if [ "$reason" = "quality_gate_failed" ] || [ "$reason" = "all_quality_candidates_exhausted" ]; then
              echo "quality_gate_blocked=true"
              exit 0
            fi
            exit "$status"
          fi

      - name: Salvar imagem e fila aprovadas
        if: steps.selecionar.outputs.found == 'true'
        run: |
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/artes instagram/fila/automatica
          if ! git diff --cached --quiet; then
            git commit -m "Prepara post com imagem única"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Reservar publicação antes de chamar a Meta
        if: steps.selecionar.outputs.found == 'true'
        run: |
          git pull --rebase --autostash origin main
          python scripts/reservar_publicacao_instagram.py reserve --batch "${{ steps.selecionar.outputs.batch_file }}"
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/reservas-publicacao.json
          if ! git diff --cached --quiet; then
            git commit -m "Reserva post antes da publicação no Instagram"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Publicar somente o item selecionado
        id: publicar
        if: steps.selecionar.outputs.found == 'true'
        continue-on-error: true
        shell: bash
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_GRAPH_VERSION: v25.0
          META_RATE_LIMIT_STATE: instagram/meta-rate-limit.json
          META_RATE_LIMIT_COOLDOWN_MINUTES: "60"
        run: |
          set +e
          output="$(python scripts/publicar_lote_instagram.py --batch "${{ steps.selecionar.outputs.batch_file }}" --ledger instagram/publicados.json 2>&1)"
          status=$?
          set -e
          echo "$output"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Registrar publicação confirmada ou reconciliada
        if: always() && steps.selecionar.outputs.found == 'true'
        run: |
          if git diff --quiet -- instagram/publicados.json; then exit 0; fi
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/publicados.json
          git commit -m "Registra publicação confirmada no Instagram"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Persistir estado de rate limit da Meta
        if: always() && steps.selecionar.outputs.found == 'true'
        run: |
          if [ -z "$(git status --porcelain -- instagram/meta-rate-limit.json)" ]; then exit 0; fi
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/meta-rate-limit.json
          git commit -m "Atualiza cooldown de rate limit da Meta"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Determinar resultado efetivo da publicação
        id: resultado_publicacao
        if: always() && steps.selecionar.outputs.found == 'true'
        shell: bash
        run: |
          git pull --rebase --autostash origin main
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          batch_path = Path(r'''${{ steps.selecionar.outputs.batch_file }}''')
          ledger_path = Path("instagram/publicados.json")
          rate_path = Path("instagram/meta-rate-limit.json")
          key = ""
          try:
              batch = json.loads(batch_path.read_text(encoding="utf-8"))
              posts = batch.get("posts", []) if isinstance(batch, dict) else []
              if posts:
                  post = json.loads(Path(str(posts[0])).read_text(encoding="utf-8"))
                  key = str(post.get("key") or post.get("idempotency_key") or "").strip()
          except Exception as exc:
              print(f"result_batch_warning={exc}")

          row = None
          try:
              ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
              for item in reversed(ledger.get("published", [])):
                  if isinstance(item, dict) and key and str(item.get("key") or "").strip() == key:
                      row = item
                      break
          except Exception as exc:
              print(f"result_ledger_warning={exc}")

          confirmed = bool(row and row.get("instagram_media_id"))
          reconciled = bool(row and row.get("reconciled_from_remote"))
          genuinely_new = bool(row and row.get("published_at") and not reconciled)
          deferred = False
          blocked_until = ""
          if not confirmed and rate_path.exists():
              try:
                  state = json.loads(rate_path.read_text(encoding="utf-8"))
                  raw = str(state.get("blocked_until") or "").strip()
                  if state.get("active") and raw:
                      until = dt.datetime.fromisoformat(raw.replace("Z", "+00:00"))
                      if until.tzinfo is None:
                          until = until.replace(tzinfo=dt.timezone.utc)
                      deferred = dt.datetime.now(dt.timezone.utc) < until.astimezone(dt.timezone.utc)
                      blocked_until = until.astimezone(dt.timezone.utc).isoformat()
              except Exception as exc:
                  print(f"result_rate_limit_warning={exc}")

          reason = "published_new" if genuinely_new else "meta_reconciled_existing" if reconciled else "meta_rate_limit_deferred" if deferred else "not_confirmed"
          print(f"publication_confirmed={str(confirmed).lower()}")
          print(f"publication_reconciled={str(reconciled).lower()}")
          print(f"publication_genuinely_new={str(genuinely_new).lower()}")
          print(f"publication_deferred={str(deferred).lower()}")
          print(f"publication_result_reason={reason}")
          if blocked_until:
              print(f"publication_resume_after={blocked_until}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"confirmed={str(confirmed).lower()}\n")
              output.write(f"reconciled={str(reconciled).lower()}\n")
              output.write(f"genuinely_new={str(genuinely_new).lower()}\n")
              output.write(f"deferred={str(deferred).lower()}\n")
              output.write(f"blocked_until={blocked_until}\n")
              output.write(f"reason={reason}\n")
          PY

      - name: Liberar reserva após confirmação ou rate limit
        if: always() && steps.selecionar.outputs.found == 'true' && (steps.resultado_publicacao.outputs.confirmed == 'true' || steps.resultado_publicacao.outputs.deferred == 'true')
        run: |
          git pull --rebase --autostash origin main
          python scripts/reservar_publicacao_instagram.py clear --batch "${{ steps.selecionar.outputs.batch_file }}"
          git config user.name "radar-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/reservas-publicacao.json
          if ! git diff --cached --quiet; then
            git commit -m "Libera reserva após publicação confirmada ou adiada"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "reservation_clear_push_retry=$attempt"
              sleep $((attempt * 2))
            done
            echo "Falha persistente ao gravar a limpeza da reserva após 3 tentativas."
            exit 1
          fi

      - name: Registrar adiamento por rate limit sem falhar o workflow
        if: always() && steps.selecionar.outputs.found == 'true' && steps.resultado_publicacao.outputs.deferred == 'true'
        run: |
          echo "meta_rate_limit_deferred=true"
          echo "meta_rate_limit_resume_after=${{ steps.resultado_publicacao.outputs.blocked_until }}"
          echo "A rodada foi adiada pela Meta; não é falha editorial nem erro do workflow."

      - name: Sinalizar somente falha real de publicação
        if: always() && steps.selecionar.outputs.found == 'true' && steps.resultado_publicacao.outputs.confirmed != 'true' && steps.resultado_publicacao.outputs.deferred != 'true'
        run: |
          echo "A publicação não foi confirmada, reconciliada nem adiada por rate limit."
          exit 1
