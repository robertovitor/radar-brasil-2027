name: Validar privacidade e resumo diário dos alertas

on:
  push:
    paths:
      - "alertas/**"
      - "scripts/alertas_ledger.py"
      - "scripts/validar_alertas_privacidade.py"
      - "scripts/resumo_diario.py"
      - "tests/test_resumo_diario.py"
      - ".github/workflows/validar-alertas-privacidade.yml"
  pull_request:
    paths:
      - "alertas/**"
      - "scripts/alertas_ledger.py"
      - "scripts/validar_alertas_privacidade.py"
      - "scripts/resumo_diario.py"
      - "tests/test_resumo_diario.py"
      - ".github/workflows/validar-alertas-privacidade.yml"
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validar ledgers
        run: python scripts/validar_alertas_privacidade.py

      - name: Testar filtros do resumo diário
        run: python -m unittest discover -s tests -p "test_resumo_diario.py" -v
