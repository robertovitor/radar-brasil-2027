name: Pesquisa editorial publica - sem Airtable
on:
  schedule:
    - cron: "35 9 * * *" # 06:35 em Brasília (UTC-3), após a leitura de sugestões
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-editorial-shared-write
  cancel-in-progress: false
jobs:
  pesquisa-publica:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RADAR_PUBLIC_ONLY: '1'
      RADAR_AIRTABLE_ALLOW: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pesquisar fontes públicas sem consultar Airtable
        run: python -m scripts.pesquisa_editorial
      - name: Persistir auditoria e inbox
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial/pesquisa-status.json editorial/inbox.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza pesquisa editorial pública sem Airtable'
            git pull --rebase origin main
            git push origin main
          fi
