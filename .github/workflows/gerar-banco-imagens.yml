name: Gerar banco de imagens abertas

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/gerar_banco_imagens_v3.py'
      - 'scripts/gerar_banco_imagens_v4.py'
      - 'scripts/ampliar_banco_imagens.py'
      - '.github/workflows/gerar-banco-imagens.yml'

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acrescentar 100 imagens ao catálogo existente
        run: python scripts/ampliar_banco_imagens.py

      - name: Validar quantidade licenças e distribuição
        run: |
          python - <<'PY'
          import csv, re
          from collections import Counter
          from pathlib import Path
          rows=list(csv.DictReader(Path('banco_imagens/catalogo.csv').open(encoding='utf-8')))
          counts=Counter(r['categoria'] for r in rows)
          assert len(rows)==600, f'Esperadas 600; encontradas {len(rows)}'
          assert counts['estadios_sedes_2027']==50, f"Cota de estadios incorreta: {counts['estadios_sedes_2027']}"
          assert counts['cidades_sedes_2027']==40, f"Cota de cidades incorreta: {counts['cidades_sedes_2027']}"
          assert counts['torcida_futebol_feminino']==10, f"Cota de torcida incorreta: {counts['torcida_futebol_feminino']}"
          assert all(r['instagram_ok']=='SIM' for r in rows), 'Ha item nao aprovado para Instagram'
          assert len({r['pagina_origem'] for r in rows})==600, 'Ha paginas duplicadas'
          assert all(r['url_direta'] for r in rows if r['status_licenca']=='APROVADA_AUTO'), 'Item automatico sem URL direta'
          novas=[r for r in rows if r['categoria'] in {'estadios_sedes_2027','cidades_sedes_2027','torcida_futebol_feminino'}]\n          assert len(novas)==100, f'Esperadas 100 imagens novas; encontradas {len(novas)}'\n          assert all(r['autor'] and r['licenca'] and r['url_licenca'] and r['atribuicao'] and r['pagina_origem'] and r['url_direta'] for r in novas), 'Novas imagens sem metadados completos de atribuicao/licenca'
          bad=re.compile(r'NFL|NCAA|Badgers|Georgia Tech|Ole Miss|American football|gridiron|touchdown|quarterback|Super Bowl',re.I)
          torcida=[r for r in rows if r['categoria']=='torcida_futebol_feminino']
          assert not any(bad.search((r['titulo']+' '+r['pessoa_local'])) for r in torcida), 'Torcida de futebol americano detectada'
          print('Validacao OK: 600 imagens, 100 novas, categorias de estadios/cidades/torcida, unicas e licenciadas')
          PY

      - name: Commit do catálogo
        run: |
          if git diff --quiet -- banco_imagens/catalogo.csv banco_imagens/catalogo.json; then
            echo 'Sem alterações no catálogo.'
            exit 0
          fi
          git config user.name 'radar-brasil-2027-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add banco_imagens/catalogo.csv banco_imagens/catalogo.json
          git commit -m 'data: amplia banco editorial para 600 imagens abertas'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
