name: Gerar banco de imagens abertas

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/gerar_banco_imagens_v3.py'
      - 'scripts/gerar_banco_imagens_v4.py'
      - 'scripts/ampliar_banco_imagens.py'
      - '.github/workflows/gerar-banco-imagens.yml'

permissions:
  contents: write

concurrency:
  group: banco-imagens-600-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acrescentar 100 imagens ao catálogo existente
        run: python scripts/ampliar_banco_imagens.py

      - name: Validar quantidade, licenças e distribuição geográfica
        run: |
          python - <<'PY'
          import csv, re
          from collections import Counter
          from pathlib import Path
          rows=list(csv.DictReader(Path('banco_imagens/catalogo.csv').open(encoding='utf-8')))
          counts=Counter(r['categoria'] for r in rows)
          assert len(rows)==600, f'Esperadas 600; encontradas {len(rows)}'
          assert counts['estadios_sedes_2027']==50
          assert counts['cidades_sedes_2027']==40
          assert counts['torcida_futebol_feminino']==10
          assert len({r['pagina_origem'] for r in rows})==600, 'Paginas de origem duplicadas'
          novas=[r for r in rows if r['categoria'] in {'estadios_sedes_2027','cidades_sedes_2027','torcida_futebol_feminino'}]
          assert len({r['url_direta'] for r in novas})==100, 'URLs diretas duplicadas nas novas imagens'
          assert len(novas)==100
          assert all(r['instagram_ok']=='SIM' and r['status_licenca'] in {'APROVADA','APROVADA_AUTO'} for r in novas)
          assert all(r['autor'] and r['licenca'] and r['url_licenca'] and r['atribuicao'] and r['pagina_origem'] and r['url_direta'] for r in novas), 'Metadados de licença/atribuição incompletos'
          cities=['Belo Horizonte','Brasília','Fortaleza','Porto Alegre','Recife','Rio de Janeiro','Salvador','São Paulo']
          stadiums={'Mineirão':7,'Mané Garrincha':6,'Castelão':6,'Beira-Rio':6,'Arena Pernambuco':6,'Maracanã':6,'Fonte Nova':6,'Neo Química Arena':7}
          city_totals={'Belo Horizonte':12,'Brasília':11,'Fortaleza':11,'Porto Alegre':11,'Recife':11,'Rio de Janeiro':11,'Salvador':11,'São Paulo':12}
          arena_city={'Mineirão':'Belo Horizonte','Mané Garrincha':'Brasília','Castelão':'Fortaleza','Beira-Rio':'Porto Alegre','Arena Pernambuco':'Recife','Maracanã':'Rio de Janeiro','Fonte Nova':'Salvador','Neo Química Arena':'São Paulo'}
          for city in cities:
              city_rows=[r for r in novas if f'CIDADE_SEDE={city}' in r['observacoes']]
              assert len(city_rows)==city_totals[city], f'Distribuicao de {city}: {len(city_rows)}; esperado {city_totals[city]}'
              city_only=[r for r in city_rows if r['categoria']=='cidades_sedes_2027']
              assert len(city_only)==5, f'Imagens da cidade {city}: {len(city_only)}; esperado 5'
          for arena, expected in stadiums.items():
              arena_rows=[r for r in novas if f'ARENA={arena}' in r['observacoes']]
              assert len(arena_rows)==expected, f'Arena {arena}: {len(arena_rows)}; esperado {expected}'
              assert all(f"CIDADE_SEDE={arena_city[arena]}" in r['observacoes'] for r in arena_rows), f'Arena {arena} associada a cidade incorreta'
          bad=re.compile(r'NFL|NCAA|Badgers|Georgia Tech|Ole Miss|American football|gridiron|touchdown|quarterback|Super Bowl',re.I)
          torcida=[r for r in novas if r['categoria']=='torcida_futebol_feminino']
          assert not any(bad.search((r['titulo']+' '+r['pessoa_local'])) for r in torcida), 'Torcida de futebol americano detectada'
          print('VALIDACAO_OK: 600 imagens; 100 novas; 5 imagens por cidade; cotas por arena; licencas, atribuicoes e URLs unicas.')
          PY

      - name: Commit do catálogo
        run: |
          if git diff --quiet -- banco_imagens/catalogo.csv banco_imagens/catalogo.json; then
            echo 'Sem alterações no catálogo.'
            exit 0
          fi
          git config user.name 'radar-brasil-2027-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add banco_imagens/catalogo.csv banco_imagens/catalogo.json
          git commit -m 'data: amplia banco editorial para 600 imagens abertas'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
