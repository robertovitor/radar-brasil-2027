name: Ping scheduler

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar horário real
        run: |
          echo "event=${{ github.event_name }}"
          echo "scheduled_cron=17 * * * *"
          echo "actual_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
