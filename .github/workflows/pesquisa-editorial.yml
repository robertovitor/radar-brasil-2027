name: Pesquisa editorial Radar

# Manutenção 2026-09-16: ativa camada v5.5 cirúrgica sem alterar schedule nem arquitetura.
on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/pesquisa_editorial.py'
      - 'scripts/pesquisa_editorial_compat_v3.py'
      - 'scripts/pesquisa_editorial_compat_v4.py'
      - 'scripts/pesquisa_editorial_compat_v5.py'
      - 'scripts/pesquisa_editorial_compat_v5_1.py'
      - 'scripts/pesquisa_editorial_compat_v5_2.py'
      - 'scripts/pesquisa_editorial_compat_v5_3.py'
      - 'scripts/pesquisa_editorial_compat_v5_4.py'
      - 'scripts/pesquisa_editorial_compat_v5_5.py'
      - 'scripts/limpar_resumos_noticias.py'
      - '.github/workflows/pesquisa-editorial.yml'

permissions:
  contents: write

concurrency:
  group: pesquisa-editorial-radar
  cancel-in-progress: false

jobs:
  pesquisar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Registrar origem do gatilho
        run: |
          echo "pesquisa_direct_schedule=${{ github.event_name == 'schedule' }}"
          echo "trigger_event=${{ github.event_name }}"
          echo "triggered_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Executar pesquisa editorial nativa
        id: pesquisa
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        shell: bash
        run: |
          set +e
          python scripts/pesquisa_editorial_compat_v5_5.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sanear resumos contaminados já publicados
        shell: bash
        run: |
          set -euo pipefail
          python scripts/limpar_resumos_noticias.py

      - name: Publicar inbox, telemetria e correções de resumo da mesma execução
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add editorial/inbox.json editorial/pesquisa-status.json noticias.json

          if git diff --cached --quiet; then
            echo 'ERRO: pesquisa não alterou inbox, pesquisa-status.json nem resumos.'
            exit 2
          fi

          git commit -m 'Atualiza resultado da pesquisa editorial nativa'
          git pull --rebase origin main
          git push origin main

      - name: Falhar workflow se a pesquisa falhou
        if: steps.pesquisa.outputs.exit_code != '0'
        run: |
          echo "Pesquisa editorial falhou com código ${{ steps.pesquisa.outputs.exit_code }}. O status já foi persistido."
          exit 1
