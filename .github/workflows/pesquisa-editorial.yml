name: Pesquisa editorial Radar

# 2026-10-28: pesquisa pública horária preservada; retomada conservadora das sugestões em novembro.
on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/pesquisa_editorial*.py'
      - 'scripts/pesquisa_oportunidades.py'
      - 'scripts/limpar_resumos_noticias.py'
      - '.github/workflows/pesquisa-editorial.yml'

permissions:
  contents: write

concurrency:
  group: pesquisa-editorial-radar
  cancel-in-progress: false

jobs:
  pesquisar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RADAR_PUBLIC_ONLY: '1'
      RADAR_AIRTABLE_ALLOW: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar CA bundle para fonte oficial
        run: |
          python -m pip install --disable-pip-version-check --no-input certifi

      - name: Registrar origem do gatilho
        run: |
          echo "pesquisa_direct_schedule=${{ github.event_name == 'schedule' }}"
          echo "trigger_event=${{ github.event_name }}"
          echo "triggered_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Definir retomada controlada das sugestões Airtable
        id: airtable_mode
        shell: bash
        run: |
          # 04:00 UTC = 01:00 em Brasília (UTC-3). Uma única janela diária.
          # Não consultar Airtable antes de 01/11/2026, quando o limite mensal pode reiniciar.
          stamp="$(date -u +%Y%m%d%H)"
          if [ "$stamp" -ge 2026110104 ] && [ "$(date -u +%H)" = "04" ]; then
            echo 'public_only=0' >> "$GITHUB_OUTPUT"
            echo 'airtable_allow=1' >> "$GITHUB_OUTPUT"
            echo 'suggestions_window=enabled_once_daily' 
          else
            echo 'public_only=1' >> "$GITHUB_OUTPUT"
            echo 'airtable_allow=0' >> "$GITHUB_OUTPUT"
            echo 'suggestions_window=public_only' 
          fi

      - name: Executar pesquisa pública e sugestões na janela controlada
        id: pesquisa
        shell: bash
        env:
          RADAR_PUBLIC_ONLY: ${{ steps.airtable_mode.outputs.public_only }}
          RADAR_AIRTABLE_ALLOW: ${{ steps.airtable_mode.outputs.airtable_allow }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          set +e
          python scripts/pesquisa_editorial_compat_v5_5.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Atualizar oportunidades (isolado)
        id: oportunidades
        shell: bash
        run: |
          set +e
          python scripts/pesquisa_oportunidades.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sanear resumos contaminados já publicados
        shell: bash
        run: |
          set -euo pipefail
          python scripts/limpar_resumos_noticias.py

      - name: Publicar inbox, telemetria e correções de resumo da mesma execução
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add editorial/inbox.json editorial/pesquisa-status.json noticias.json oportunidades.json editorial/oportunidades-status.json

          if git diff --cached --quiet; then
            echo 'Pesquisa concluída sem mudanças publicáveis; não há commit a criar.'
            exit 0
          fi

          git commit -m 'Atualiza resultado da pesquisa editorial nativa'
          git pull --rebase origin main
          git push origin main

      - name: Falhar workflow se oportunidades falhou
        if: steps.oportunidades.outputs.exit_code != '0'
        run: |
          echo "Pesquisa de oportunidades falhou com código ${{ steps.oportunidades.outputs.exit_code }}."
          exit 1

      - name: Falhar workflow se a pesquisa falhou
        if: steps.pesquisa.outputs.exit_code != '0'
        run: |
          echo "Pesquisa editorial falhou com código ${{ steps.pesquisa.outputs.exit_code }}. O status já foi persistido."
          exit 1
