name: Disparar Instagram após merge editorial

on:
  workflow_run:
    workflows: ['Mesclar inbox editorial']
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: instagram-apos-merge
  cancel-in-progress: false

jobs:
  disparar-instagram:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar publicação do Instagram
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/publicar-instagram-automatico.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'INSTAGRAM_DISPATCH_OK=true'
