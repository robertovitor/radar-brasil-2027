name: Corrigir imagem de compartilhamento social

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-social-image.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Atualizar URLs da imagem social
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://robertovitor.github.io/radar-brasil-2027/radar-social-1200x630.jpg'
          new = 'https://radarcopafeminina2027.com.br/radar-social-1200x630.jpg'
          if old not in s:
              raise SystemExit('URL antiga não encontrada em index.html')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar correção
        run: |
          git config user.name "radar-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Corrige imagem social para o domínio oficial"
          git push origin HEAD:main
