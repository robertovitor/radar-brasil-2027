name: Corrigir imagem de compartilhamento social

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-social-image.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Criar nova versão da imagem social e atualizar metatags
        run: |
          cp radar-social-1200x630.jpg radar-social-1200x630-v2.jpg
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://radarcopafeminina2027.com.br/radar-social-1200x630.jpg'
          new = 'https://radarcopafeminina2027.com.br/radar-social-1200x630-v2.jpg'
          if old not in s:
              raise SystemExit('URL atual da imagem não encontrada em index.html')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar correção
        run: |
          git config user.name "radar-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html radar-social-1200x630-v2.jpg
          git commit -m "Renova imagem de compartilhamento social"
          git push origin HEAD:main
