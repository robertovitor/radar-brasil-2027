name: Consumir sugestões Airtable (diário controlado)

on:
  # Agendamento diário às 09h20 de Brasília.
  schedule:
    - cron: '20 12 * * *'
  workflow_dispatch:
  # Gatilho pontual para executar o lote pendente ainda hoje.
  push:
    paths:
      - '.github/dispatch/consumir-sugestoes-hoje'
      - '.github/workflows/consumir-sugestoes-diarias.yml'

permissions:
  contents: write

concurrency:
  group: radar-editorial-shared-write
  cancel-in-progress: false

jobs:
  consumir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RADAR_PUBLIC_ONLY: '0'
      RADAR_AIRTABLE_ALLOW: '1'
      RADAR_SUGGESTIONS_RETRY: '1'
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validar sintaxe antes de acessar Airtable
        run: |
          python -m py_compile scripts/consumir_sugestoes_diarias.py
          python -m py_compile scripts/pesquisa_editorial.py scripts/pesquisa_editorial_compat_v5_5.py

      - name: Processar no máximo duas leituras e quatro escritas
        run: python scripts/consumir_sugestoes_diarias.py

      - name: Persistir inbox e auditoria diária
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial/inbox.json editorial/sugestoes-diarias-status.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração; consumo diário já realizado.'
            exit 0
          fi
          git commit -m 'Processa lote diario controlado de sugestoes'
          git pull --rebase origin main
          git push origin main
