name: Sincronizar planilha do Radar

on:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - 'dados.json'
      - 'noticias.json'
      - 'scripts/sincronizar_planilha.py'
      - '.github/workflows/sincronizar-planilha.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronizar-planilha-radar
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install openpyxl==3.1.5

      - name: Atualizar Radar_Brasil_2027.xlsx
        run: python scripts/sincronizar_planilha.py

      - name: Publicar planilha somente se houver mudança
        run: |
          if git diff --quiet -- Radar_Brasil_2027.xlsx; then
            echo 'Planilha já está sincronizada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Radar_Brasil_2027.xlsx
          git commit -m 'Sincroniza planilha com dados atuais do Radar'
          git pull --rebase origin main
          git push origin main
