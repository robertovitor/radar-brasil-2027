name: Otimizar preview WhatsApp

on:
  push:
    paths:
      - '.github/workflows/otimizar-preview-whatsapp.yml'

permissions:
  contents: write

jobs:
  otimizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar imagem social otimizada
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          src = Path('radar-social-2027.png')
          out = Path('radar-preview-1200x630.jpg')
          img = Image.open(src).convert('RGB')
          img = ImageOps.fit(img, (1200, 630), method=Image.Resampling.LANCZOS)
          img.save(out, 'JPEG', quality=82, optimize=True, progressive=True)
          print('preview_bytes=', out.stat().st_size)
          if out.stat().st_size > 500000:
              raise SystemExit('Imagem social ainda está grande demais')
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://radarfutebolfeminino2027.com.br/radar-social-2027.png?v=3'
          new = 'https://radarfutebolfeminino2027.com.br/radar-preview-1200x630.jpg?v=5'
          if old not in s:
              raise SystemExit('URL social atual não encontrada no index')
          s = s.replace(old, new)
          s = s.replace('<meta property="og:image:type" content="image/png">','<meta property="og:image:type" content="image/jpeg">')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar metadados
        run: |
          test -f radar-preview-1200x630.jpg
          grep -F 'radar-preview-1200x630.jpg?v=5' index.html
          grep -F 'og:image:type" content="image/jpeg' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html radar-preview-1200x630.jpg
          git commit -m 'Otimiza imagem do preview do WhatsApp' || exit 0
          git push
