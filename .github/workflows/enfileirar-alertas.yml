name: Enfileirar alertas aos assinantes

on:
  # Uma única rodada diária; o script enfileira no máximo um item por execução.
  schedule:
    - cron: "0 12 * * *" # 02:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enfileirar-alertas-assinantes
  cancel-in-progress: false

jobs:
  enfileirar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Registrar gatilho
        run: |
          echo "trigger_event=${{ github.event_name }}"
          echo "trigger_schedule=${{ github.event.schedule || '' }}"
          echo "triggered_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Enfileirar no máximo um item pendente
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          RADAR_AIRTABLE_ALLOW: '1'
        run: python scripts/enfileirar_alertas.py
