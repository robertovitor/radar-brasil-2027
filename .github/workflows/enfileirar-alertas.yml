name: Enfileirar alertas aos assinantes

on:
  # EMERGENCIA 2026-10-09: suspensos schedule e push para conter consumo Airtable.
  # Reativar somente apos auditoria de chamadas e validacao do usuario.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enfileirar-alertas-assinantes
  cancel-in-progress: false

jobs:
  enfileirar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Registrar gatilho
        run: |
          echo "trigger_event=${{ github.event_name }}"
          echo "trigger_schedule=${{ github.event.schedule || '' }}"
          echo "triggered_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Enfileirar no máximo um item pendente
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python scripts/enfileirar_alertas.py
