name: Enfileirar alertas aos assinantes (legado bloqueado)

on:
  # Agendamento removido: o resumo diário é o único fluxo autorizado para assinantes.
  # Disparo manual mantido apenas para diagnóstico, sem credenciais nem execução do enfileirador.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enfileirar-alertas-assinantes
  cancel-in-progress: false

jobs:
  bloqueado:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar sintaxe sem acessar serviços externos
        run: python -m py_compile scripts/enfileirar_alertas.py
      - name: Confirmar bloqueio do fluxo legado
        run: echo "Fluxo legado bloqueado: nenhum alerta enfileirado; nenhuma chamada Airtable; nenhum e-mail enviado."
