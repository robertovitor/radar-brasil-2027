name: Atualizar dados.json pelo Dropbox

on:
  push:
    paths:
      - "scripts/atualizar_dados.py"
      - ".github/workflows/atualizar-dados.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados-json
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install openpyxl==3.1.5 requests==2.32.5

      - name: Atualizar dados.json
        env:
          SOURCE_URL: "https://www.dropbox.com/scl/fi/qayb7xd8qzr0rn5ga9f10/Radar_Brasil_2027_v6_1_Ago2026.xlsx?rlkey=0rr5fqaj11eajkati8uso5chr&st=4g43p3cg&dl=0"
        run: python scripts/atualizar_dados.py

      - name: Publicar somente se houver mudança
        run: |
          if git diff --quiet -- dados.json; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dados.json
          git commit -m "Atualiza dados.json pela planilha do Dropbox"
          git push
