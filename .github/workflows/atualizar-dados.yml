name: Atualizar site pela planilha do GitHub

on:
  push:
    paths:
      - "Radar_Brasil_2027.xlsx"
      - "scripts/atualizar_dados.py"
      - ".github/workflows/atualizar-dados.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados-json
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install openpyxl==3.1.5

      - name: Atualizar dados.json
        env:
          SOURCE_FILE: "Radar_Brasil_2027.xlsx"
        run: python scripts/atualizar_dados.py

      - name: Publicar somente se houver mudança
        run: |
          if [ -z "$(git status --porcelain -- dados.json noticias.json)" ]; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dados.json noticias.json
          git commit -m "Atualiza dados e notícias pela planilha do GitHub"
          git push
