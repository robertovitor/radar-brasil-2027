name: Heartbeat de contingência do Radar

on:
  schedule:
    - cron: '22 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heartbeat-orquestrador.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: heartbeat-contingencia-radar
  cancel-in-progress: false

jobs:
  recuperar-cadeia:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: main
      MAX_AGE_MINUTES: '90'
    steps:
      - name: Verificar somente etapas GitHub da cadeia
        shell: bash
        run: |
          set -euo pipefail

          api() {
            local method="$1"
            local path="$2"
            shift 2
            curl --fail-with-body --silent --show-error \
              -X "$method" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@" \
              "https://api.github.com/repos/${REPO}/${path}"
          }

          recent_healthy_run() {
            local workflow="$1"
            local now cutoff
            now=$(date -u +%s)
            cutoff=$((now - MAX_AGE_MINUTES * 60))
            api GET "actions/workflows/${workflow}/runs?branch=${BRANCH}&per_page=20" \
              | jq -e --argjson cutoff "$cutoff" '
                  any(.workflow_runs[];
                    ((.created_at | fromdateiso8601) >= $cutoff) and
                    (.status != "completed" or .conclusion == "success")
                  )
                ' >/dev/null
          }

          dispatch_workflow() {
            local workflow="$1"
            local label="$2"
            echo "CONTINGÊNCIA: ${label} sem execução saudável recente; disparando ${workflow}."
            api POST "actions/workflows/${workflow}/dispatches" \
              -H 'Content-Type: application/json' \
              -d "{\"ref\":\"${BRANCH}\"}" >/dev/null
          }

          # O ciclo principal agora é a automação única do Radar. Este workflow não
          # consulta Airtable, não faz pesquisa editorial e não envia e-mail.
          # Ele apenas recupera os dois pontos GitHub que precisam materializar.
          if recent_healthy_run 'mesclar-inbox-editorial.yml'; then
            echo 'OK: merge editorial/site teve execução saudável recente.'
          else
            dispatch_workflow 'mesclar-inbox-editorial.yml' 'merge editorial/site'
          fi

          # A planilha já é sincronizada dentro de mesclar-inbox-editorial.yml;
          # portanto não há mais disparo separado de sincronizar-planilha.yml.

          if recent_healthy_run 'publicar-instagram-automatico.yml'; then
            echo 'OK: Instagram teve execução saudável recente.'
          else
            dispatch_workflow 'publicar-instagram-automatico.yml' 'publicação Instagram'
          fi

          echo 'Heartbeat de contingência concluído.'
