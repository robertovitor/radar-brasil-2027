name: Heartbeat das rotinas do Radar

on:
  schedule:
    # Minuto fora do topo da hora para reduzir risco de atraso do scheduler.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heartbeat-orquestrador.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: heartbeat-rotinas-radar
  cancel-in-progress: false

jobs:
  recuperar-rotinas:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: main
      MAX_AGE_MINUTES: '80'
    steps:
      - name: Verificar e recuperar etapas ausentes
        shell: bash
        run: |
          set -euo pipefail

          api() {
            local method="$1"
            local path="$2"
            shift 2
            curl --fail-with-body --silent --show-error \
              -X "$method" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@" \
              "https://api.github.com/repos/${REPO}/${path}"
          }

          recent_success() {
            local workflow="$1"
            local cutoff now created created_epoch
            now=$(date -u +%s)
            cutoff=$(( now - MAX_AGE_MINUTES * 60 ))
            created=$(api GET "actions/workflows/${workflow}/runs?branch=${BRANCH}&status=success&per_page=1" \
              | jq -r '.workflow_runs[0].created_at // empty')
            [[ -n "$created" ]] || return 1
            created_epoch=$(date -u -d "$created" +%s)
            (( created_epoch >= cutoff ))
          }

          current_cycle_healthy() {
            local workflow="$1"
            local cycle_start
            cycle_start=$(date -u +%Y-%m-%dT%H:00:00Z)

            api GET "actions/workflows/${workflow}/runs?branch=${BRANCH}&per_page=20" \
              | jq -e --arg cycle_start "$cycle_start" '
                  any(.workflow_runs[];
                    .created_at >= $cycle_start and
                    (.status != "completed" or .conclusion == "success")
                  )
                ' >/dev/null
          }

          wait_for_dispatch() {
            local workflow="$1"
            local started_at="$2"
            local deadline run_id status conclusion
            deadline=$(( $(date -u +%s) + 900 ))
            run_id=""

            while (( $(date -u +%s) < deadline )); do
              run_id=$(api GET "actions/workflows/${workflow}/runs?branch=${BRANCH}&event=workflow_dispatch&per_page=10" \
                | jq -r --arg started "$started_at" '[.workflow_runs[] | select(.created_at >= $started)] | sort_by(.created_at) | last | .id // empty')
              [[ -n "$run_id" ]] && break
              sleep 5
            done

            if [[ -z "$run_id" ]]; then
              echo "::error::Não foi possível localizar a execução disparada de ${workflow}."
              return 1
            fi

            while (( $(date -u +%s) < deadline )); do
              read -r status conclusion < <(api GET "actions/runs/${run_id}" | jq -r '[.status, (.conclusion // "-")] | @tsv')
              echo "${workflow}: run ${run_id} status=${status} conclusion=${conclusion}"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]]
                return
              fi
              sleep 10
            done

            echo "::error::Timeout aguardando ${workflow} (run ${run_id})."
            return 1
          }

          dispatch_and_wait() {
            local workflow="$1"
            local label="$2"
            local started_at

            echo "RECUPERAÇÃO: ${label}; disparando ${workflow}."
            started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            api POST "actions/workflows/${workflow}/dispatches" \
              -H 'Content-Type: application/json' \
              -d "{\"ref\":\"${BRANCH}\"}" >/dev/null
            wait_for_dispatch "$workflow" "$started_at"
          }

          ensure_current_cycle() {
            local workflow="$1"
            local label="$2"

            if current_cycle_healthy "$workflow"; then
              echo "OK: ${label} já executou ou está executando neste ciclo horário."
              return 0
            fi

            dispatch_and_wait "$workflow" "${label} não executou neste ciclo horário"
          }

          ensure_workflow() {
            local workflow="$1"
            local label="$2"

            if recent_success "$workflow"; then
              echo "OK: ${label} teve execução bem-sucedida nos últimos ${MAX_AGE_MINUTES} minutos."
              return 0
            fi

            dispatch_and_wait "$workflow" "${label} não teve sucesso recente"
          }

          # O editorial tem schedule próprio e deve rodar em cada ciclo.
          # O heartbeat é apenas contingência caso a rodada horária não apareça.
          ensure_current_cycle 'mesclar-inbox-editorial.yml' 'Mesclar inbox editorial'

          # As demais rotinas mantêm a tolerância histórica de recuperação.
          ensure_workflow 'sincronizar-planilha.yml' 'Sincronizar planilha do Radar'
          ensure_workflow 'publicar-instagram-automatico.yml' 'Publicar automaticamente no Instagram'

          echo 'Heartbeat concluído: cadeia crítica verificada.'
