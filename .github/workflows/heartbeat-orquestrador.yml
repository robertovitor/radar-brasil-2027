name: Orquestrador principal do Radar

on:
  schedule:
    # O ciclo editorial do ChatGPT permanece às :45. O GitHub assume a
    # materialização determinística da cadeia dois minutos depois.
    - cron: '47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heartbeat-orquestrador.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: orquestrador-principal-radar
  cancel-in-progress: false

jobs:
  executar-cadeia:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: main
    steps:
      - name: Executar site e Instagram em ordem estrita
        shell: bash
        run: |
          set -euo pipefail

          api() {
            local method="$1"
            local path="$2"
            shift 2
            curl --fail-with-body --silent --show-error \
              -X "$method" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@" \
              "https://api.github.com/repos/${REPO}/${path}"
          }

          dispatch() {
            local workflow="$1"
            api POST "actions/workflows/${workflow}/dispatches" \
              -H 'Content-Type: application/json' \
              -d "{\"ref\":\"${BRANCH}\"}" >/dev/null
          }

          wait_new_run() {
            local workflow="$1"
            local started_epoch="$2"
            local run_id=""
            for attempt in $(seq 1 24); do
              run_id=$(api GET "actions/workflows/${workflow}/runs?branch=${BRANCH}&event=workflow_dispatch&per_page=20" \
                | jq -r --argjson started "$started_epoch" '
                    [.workflow_runs[]
                     | select((.created_at | fromdateiso8601) >= ($started - 5))]
                    | sort_by(.created_at)
                    | last
                    | .id // empty')
              if [ -n "$run_id" ]; then
                echo "$run_id"
                return 0
              fi
              sleep 5
            done
            return 1
          }

          wait_success() {
            local run_id="$1"
            for attempt in $(seq 1 180); do
              payload=$(api GET "actions/runs/${run_id}")
              status=$(jq -r '.status' <<<"$payload")
              conclusion=$(jq -r '.conclusion // empty' <<<"$payload")
              echo "run=${run_id} status=${status} conclusion=${conclusion:-pending}" >&2
              if [ "$status" = "completed" ]; then
                [ "$conclusion" = "success" ]
                return
              fi
              sleep 5
            done
            echo "Timeout aguardando run ${run_id}." >&2
            return 1
          }

          # 1) SITE/JSON/PLANILHA. Executa sempre; quando inbox está vazio,
          # mesclar-inbox-editorial.py termina em no-op, sem publicar duplicatas.
          site_started=$(date -u +%s)
          echo "Disparando merge/site..."
          dispatch 'mesclar-inbox-editorial.yml'
          site_run=$(wait_new_run 'mesclar-inbox-editorial.yml' "$site_started") || {
            echo 'FALHA OPERACIONAL: merge/site não materializou.'
            exit 1
          }
          echo "site_run=${site_run}"
          wait_success "$site_run" || {
            echo "FALHA OPERACIONAL: merge/site run ${site_run} não concluiu com sucesso."
            exit 1
          }

          # 2) INSTAGRAM. Só começa depois de site/planilha concluídos.
          instagram_started=$(date -u +%s)
          echo "Disparando Instagram após sucesso do site..."
          dispatch 'publicar-instagram-automatico.yml'
          instagram_run=$(wait_new_run 'publicar-instagram-automatico.yml' "$instagram_started") || {
            echo 'FALHA OPERACIONAL: Instagram não materializou.'
            exit 1
          }
          echo "instagram_run=${instagram_run}"
          wait_success "$instagram_run" || {
            echo "FALHA OPERACIONAL: workflow do Instagram não concluiu com sucesso."
            exit 1
          }

          echo 'CADEIA_GITHUB_OK=true'
          echo "site_run=${site_run}"
          echo "instagram_run=${instagram_run}"
          echo 'Orquestração GitHub concluída em ordem: site/planilha -> Instagram.'
