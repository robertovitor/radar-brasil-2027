name: Corrigir domínio e metadados

on:
  push:
    paths:
      - '.github/workflows/corrigir-dominio.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Atualizar domínio e branding estático
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('https://radarcopafeminina2027.com.br/', 'https://radarfutebolfeminino2027.com.br/')
          s = s.replace('Radar Brasil 2027 | Copa do Mundo Feminina', 'Radar Brasil 2027 | Mundial Feminino 2027')
          s = s.replace('Eventos, notícias e ativações da Copa do Mundo Feminina 2027 no Brasil. Acompanhe tudo em um só lugar.', 'Eventos, notícias e ativações do Mundial Feminino 2027 no Brasil. Acompanhe tudo em um só lugar.')
          s = s.replace('Eventos, notícias e ativações da Copa do Mundo Feminina 2027 no Brasil.', 'Eventos, notícias e ativações do Mundial Feminino 2027 no Brasil.')
          s = s.replace('Monitoramento de eventos e notícias da Copa do Mundo Feminina 2027', 'Monitoramento de eventos e notícias do Mundial Feminino 2027')
          s = s.replace('Notícias e sinais relevantes sobre a Copa do Mundo Feminina 2027.', 'Notícias e sinais relevantes sobre o Mundial Feminino 2027.')
          if s == old:
              raise SystemExit('Nenhuma alteração necessária em index.html')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar domínio antigo removido do index
        run: |
          if grep -q 'radarcopafeminina2027.com.br' index.html; then
            echo 'Domínio antigo ainda encontrado em index.html'
            exit 1
          fi
          grep -q 'https://radarfutebolfeminino2027.com.br/' index.html
      - name: Commit da correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Atualiza domínio e metadados do Radar'
          git push
