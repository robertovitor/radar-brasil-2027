name: Otimizar preview social

on:
  push:
    paths:
      - '.github/workflows/otimizar-preview-social.yml'
      - 'radar-brasil-2027-social.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  otimizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: pip install pillow

      - name: Gerar imagem 1200x630 otimizada
        run: |
          python - <<'PY'
          from PIL import Image

          src = Image.open('radar-brasil-2027-social.png').convert('RGB')
          canvas = Image.new('RGB', (1200, 630), 'white')
          src.thumbnail((1200, 630), Image.Resampling.LANCZOS)
          x = (1200 - src.width) // 2
          y = (630 - src.height) // 2
          canvas.paste(src, (x, y))
          canvas.save('radar-social-1200x630.jpg', 'JPEG', quality=82, optimize=True, progressive=True)
          print('Gerada:', canvas.size)
          PY

      - name: Atualizar metatags para a imagem otimizada
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://radarcopafeminina2027.com.br/radar-brasil-2027-social.png'
          new = 'https://radarcopafeminina2027.com.br/radar-social-1200x630.jpg?v=3'
          s = s.replace(old, new)
          s = s.replace('<meta property="og:image:type" content="image/png">', '<meta property="og:image:type" content="image/jpeg">\n<meta property="og:image:width" content="1200">\n<meta property="og:image:height" content="630">')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commitar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar-social-1200x630.jpg index.html
          git diff --cached --quiet || git commit -m "Otimiza imagem de compartilhamento social"
          git push
