name: Ajustar preview WhatsApp

on:
  push:
    paths:
      - '.github/workflows/ajustar-preview-whatsapp.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar metadados sociais
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='https://radarfutebolfeminino2027.com.br/Radar%20Brasil%202027_%20O%20Mundo%20Se%20Conecta.png?v=20260904-2'
          new='https://radarfutebolfeminino2027.com.br/radar-social-2027.png?v=3'
          s=s.replace(old,new)
          s=s.replace('<meta property="og:image:type" content="image/jpeg">','<meta property="og:image:type" content="image/png">')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -F 'https://radarfutebolfeminino2027.com.br/radar-social-2027.png?v=3' index.html
          grep -F '<meta property="og:image:type" content="image/png">' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Ajusta preview social para WhatsApp' || exit 0
          git push
